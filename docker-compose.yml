version: "3.2"
services:
  db:
    container_name: blog-web-container
    image: postgres:15.7-alpine3.18
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DATABASE}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - emr-postgres:/var/lib/postgresql/data

volumes:
  emr-postgres:
    driver: local